  <script type="module">
    import { attachBrowserPlatformCore, readBrowserUiSettings } from './platform/browser-core.js';

    attachBrowserPlatformCore(window);
    const s = readBrowserUiSettings(window, 'gamefy-local-settings-v1');
    document.documentElement.setAttribute('data-ui-theme', s.uiThemeId || 'dark');
    document.documentElement.setAttribute('data-ui-density', 'compact');
    if ((s.uiThemeId || 'dark') === 'custom' && s.uiThemeCustomColor) {
      document.documentElement.style.setProperty('--ui-accent', s.uiThemeCustomColor);
    }
  </script>
  <script>
    (function () {
      function clearFallbackClosed() {
        document.querySelectorAll('.faction-modal-backdrop[data-fallback-closed="true"]').forEach(function (backdrop) {
          backdrop.style.removeProperty('display');
          backdrop.removeAttribute('data-fallback-closed');
        });
      }

      function closeFactionDetailNative(event) {
        var target = event && event.target && event.target.closest
          ? event.target.closest('[data-faction-close-detail], .faction-rpg-close')
          : null;
        if (event && !target) return false;
        if (event && event.preventDefault) event.preventDefault();
        if (event && event.stopPropagation) event.stopPropagation();

        function hideCurrentBackdrop() {
          var root = target && target.closest ? target.closest('.faction-modal-backdrop') : null;
          var roots = root ? [root] : Array.prototype.slice.call(document.querySelectorAll('.faction-modal-backdrop'));
          roots.forEach(function (backdrop) {
            if (backdrop.querySelector('.faction-detail, .faction-org-modal')) {
              backdrop.style.setProperty('display', 'none', 'important');
              backdrop.setAttribute('data-fallback-closed', 'true');
            }
          });
        }

        var store = window.Alpine && window.Alpine.store ? window.Alpine.store('game') : null;
        if (store && store.closeFactionDetail) {
          store.closeFactionDetail();
          hideCurrentBackdrop();
          return true;
        }
        if (store && store.factionState) {
          store.factionState.detailOpen = false;
          store.factionState.orgChartOpen = false;
          store.factionState.selectedArchiveDocId = '';
          hideCurrentBackdrop();
          return true;
        }
        hideCurrentBackdrop();
        return true;
      }

      function openFactionDetailNative(event) {
        var row = event.target && event.target.closest ? event.target.closest('[data-faction-id]') : null;
        if (!row || !row.classList || !row.classList.contains('faction-row')) return;
        var factionId = row.getAttribute('data-faction-id') || '';
        var store = window.Alpine && window.Alpine.store ? window.Alpine.store('game') : null;
        if (store && store.selectFaction && factionId) {
          store.selectFaction(factionId);
          if (store.closeFactionArchiveDoc) store.closeFactionArchiveDoc();
          clearFallbackClosed();
          return;
        }
        var detail = Array.prototype.slice.call(document.querySelectorAll('.faction-modal-backdrop'))
          .find(function (backdrop) { return backdrop.querySelector('.faction-detail'); });
        if (detail) {
          if (event.preventDefault) event.preventDefault();
          detail.style.removeProperty('display');
          detail.removeAttribute('data-fallback-closed');
          detail.scrollTop = 0;
        }
      }

      function installFactionDetailNativeNav() {
        if (window.__factionDetailCloseFallbackInstalled) return;
        window.__factionDetailCloseFallbackInstalled = true;
        if (document.documentElement && document.documentElement.dataset) {
          document.documentElement.dataset.factionNativeNav = 'force-hide-v4';
        }
        document.addEventListener('pointerdown', closeFactionDetailNative, true);
        document.addEventListener('click', closeFactionDetailNative, true);
        document.addEventListener('click', openFactionDetailNative, true);
      }

      window.closeFactionDetailNative = closeFactionDetailNative;
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', installFactionDetailNativeNav);
      } else {
        installFactionDetailNativeNav();
      }
    })();
  </script>

  <script>
    window.openEventAppNative = async function openEventAppNative(event) {
      try {
        var store = window.Alpine && window.Alpine.store ? window.Alpine.store('game') : null;
        if (!store) return;
        if (typeof store.openEventApp !== 'function') {
          if (window.GameBoot && window.GameBoot.loadScript) {
            await window.GameBoot.loadScript('event-system.js');
            await window.GameBoot.loadScript('event-actions.js');
          }
          if (window.GameModules && window.GameModules.remergeGameStore) window.GameModules.remergeGameStore();
          store = window.Alpine && window.Alpine.store ? window.Alpine.store('game') : store;
        }
        if (typeof store.openEventApp === 'function') {
          store.openEventApp();
        } else if (store.eventState) {
          store.closeDesktopApps?.();
          store.eventState.open = true;
          store.desktopUnlocked = true;
        }
      } catch (err) {
        console.warn('[濡楀矂娼癩 閸樼喓鏁撻幍鎾崇磻娴滃娆PP婢惰精瑙?', err && err.message ? err.message : err);
      }
    };

                          <button class="rpg-item-card" :class="{ open: $store.game.isRpgItemOpen(field, index) }" type="button" @click="$store.game.toggleRpgItem(field, index)"><strong x-text="$store.game.rpgItemSummary(item, field)"></strong><p class="rpg-field-detail" x-show="$store.game.isRpgItemOpen(field, index)" x-text="$store.game.rpgItemDetail(field, item)"></p></button>
                        </template>
                      </div>
                      <p class="rpg-field-detail" x-show="!$store.game.isRpgListField(field) && !$store.game.isLexiconField(field) && $store.game.isRpgFieldOpen(field)" x-text="$store.game.rpgFieldDetail(field)"></p>
                    </div>
                  </template>
                </section>
              </template>
            </div>
            <div class="memory-editor" x-show="$store.game.profileViewMode === 'addMemory'">
              <textarea x-model="$store.game.memoryInput" placeholder="鏉堟挸鍙嗙憰浣稿晸閸忋儴顕氱憴鎺曞閻ㄥ嫯顔囪箛?.."></textarea>
              <button @click="$store.game.addManualMemory()" :disabled="!$store.game.memoryInput.trim()">閸愭瑥鍙嗙拋鏉跨箓</button>
            </div>
            <div class="memory-list" x-show="$store.game.profileViewMode === 'shortTerm'">
              <small x-text="$store.game.memoryStatus('shortTerm')"></small>
              <template x-for="item in $store.game.memoryItems('shortTerm')" :key="item.id"><p><b x-text="`${item.time?.label || '閺冨爼妫块張顏嗙叀'}閿濇粌宓冪挒?{item.impression}`"></b><span x-text="item.summary || item.text"></span></p></template>
              <small x-show="!$store.game.memoryItems('shortTerm').length">閺嗗倹妫ら惌顓熸埂鐠佹澘绻?/small>
            </div>
            <div class="memory-list" x-show="$store.game.profileViewMode === 'longTerm'">
              <small x-text="$store.game.memoryStatus('longTerm')"></small>
              <template x-for="item in $store.game.memoryItems('longTerm')" :key="item.id"><p><b x-text="`${item.time?.label || '閺冨爼妫块張顏嗙叀'}閿濇粌宓冪挒?{item.impression}`"></b><span x-text="item.summary || item.text"></span></p></template>
              <small x-show="!$store.game.memoryItems('longTerm').length">閺嗗倹妫ら梹鎸庢埂鐠佹澘绻?/small>
            </div>
            <div class="memory-editor" x-show="$store.game.profileViewMode === 'archive'">
              <div class="memory-search-row">
                <input x-model="$store.game.memoryArchiveQuery" placeholder="鏉堟挸鍙嗛幇蹇撴禈閿涘本鎮崇槐銏ｎ嚉鐟欐帟澹婄拋鏉跨箓瑜版帗銆?.." @keydown.enter="$store.game.searchMemoryArchive()">
                <button @click="$store.game.searchMemoryArchive()" :disabled="!$store.game.memoryArchiveQuery.trim()">閹兼粎鍌?/button>
              </div>
              <div class="memory-list">
                <template x-for="item in $store.game.memoryArchiveResults" :key="item.id"><p x-text="item.text"></p></template>
                <small x-show="!$store.game.memoryArchiveResults.length">閺嗗倹妫ら幖婊呭偍缂佹挻鐏?/small>
              </div>
            </div>
            </div>
          </div>
        </section>
        </div>
      </aside>

      <section class="panel story-panel dev-section" data-section-title="閸撗勫剰閺冦儱绻旈崠?>
        <div class="scene-title dev-section" data-section-title="閸︾儤娅欓弽鍥暯閺?>
          <span x-text="$store.game.sceneTitle"></span>
          <b x-text="`缁?${$store.game.turn} 閸ョ偛鎮巂"></b>
        </div>
        <div class="story-log scroll-area dev-section" data-section-title="鐏忓繗顕╃拋鏉跨秿閸掓銆? x-ref="storyLog">
          <template x-for="entry in $store.game.novelLogEntries()" :key="entry.id">
            <article class="novel-entry" :class="entry.type">
              <div>
                <div class="novel-player dev-section" data-section-title="閻溾晛顔嶉崶鐐差槻閸愬懎顔? x-show="entry.playerVisible !== false"><p x-text="entry.playerText"></p></div>
                <div class="novel-story dev-section" data-section-title="AI閻㈢喐鍨氶崘鍛啇" :class="{ streaming: entry.streaming }">
                  <div class="novel-thinking dev-section" data-section-title="AI閹繆鈧啫鍞寸€? x-show="entry.thinking && (entry.streaming || entry.thinkingOpen)"><p><b>閵嗘€塈閹繆鈧啨鈧?/b><span x-text="entry.thinking"></span></p></div>
                  <div class="novel-tool-row">
                    <button class="thinking-toggle" x-show="entry.thinking && !entry.streaming" @click="$store.game.toggleNovelThinking(entry.id)" x-text="entry.thinkingOpen ? '閳? : '閳?"></button>
                    <button class="card-change-toggle" :class="{ open: entry.cardChangesOpen }" x-show="entry.characterCardChanges?.length" @click="$store.game.toggleCardChanges(entry)" x-text="entry.cardChangesOpen ? '鐟欐帟澹婇崡鈥冲綁閺囩补鏌? : '鐟欐帟澹婇崡鈥冲綁閺囩补鏌?"></button>
                    <button class="prompt-toggle" x-show="entry.promptPack" @click="$store.game.openNovelPrompt(entry.id)" title="閺屻儳婀呴悽鐔稿灇閹绘劗銇氱拠?>閳?/button>
                  </div>
                  <p class="novel-body-text" x-text="entry.storyText"></p>
                  <section class="solidify-dock entry-solidify-dock" x-show="$store.game.solidifyEntryCards(entry).length" x-cloak>
                    <div class="solidify-side-tabs">
                      <template x-for="card in $store.game.solidifyEntryCards(entry)" :key="`${entry.id}-${$store.game.solidifyKey(card)}`">
                        <button type="button" class="solidify-tab" :class="{active: $store.game.solidifyKey(card) === $store.game.solidifyKey($store.game.selectedSolidifyCard(entry)), role: card.displayType === 'role'}" @click="$store.game.selectEntrySolidifyCard(entry, card)"><b x-text="card.name"></b><span x-text="$store.game.solidifyTypeLabel(card)"></span></button>
                      </template>
                    </div>
                    <article class="solidify-panel" x-show="entry.solidifyOpen">
                      <header><strong x-text="$store.game.solidifyPanelTitle($store.game.selectedSolidifyCard(entry))"></strong><button type="button" @click="$store.game.closeEntrySolidifyPanel(entry)">閸忔娊妫?/button></header>
                      <section class="solidify-card" x-show="$store.game.selectedSolidifyCard(entry)">
                        <h3 x-text="$store.game.selectedSolidifyCard(entry)?.name"></h3>
                        <template x-for="row in $store.game.solidifyDetailRows($store.game.selectedSolidifyCard(entry))" :key="row[0]"><p><b x-text="`${row[0]}閿涙瓪"></b><span x-text="row[1]"></span></p></template>
                        <div class="solidify-actions" x-show="$store.game.selectedSolidifyCard(entry)?.displayType !== 'role'"><button type="button" @click="$store.game.solidifySelectedIntroCard($store.game.selectedSolidifyCard(entry), entry)">閸ュ搫瀵叉稉楦款潡閼规彃宕?/button></div>
                      </section>
                    </article>
                  </section>
                  <div class="card-change-panel" x-show="entry.cardChangesOpen"><template x-for="change in entry.characterCardChanges" :key="`${change.at}-${change.field}-${change.name}`"><p><b x-text="change.field"></b><span x-text="`${change.name || ''}閿?{typeof change.value === 'object' ? JSON.stringify(change.value) : change.value}閿濇粎鎮婇悽鎲嬬窗${change.reason}`"></span></p></template></div>
                </div>
              </div>
            </article>
          </template>
          <div class="story-choice-list dev-section" data-section-title="閸撗勫剰鐞涘苯濮╅柅澶愩€? x-show="!$store.game.busy && $store.game.choices.length">
            <template x-for="choice in $store.game.choices.slice(0, 4)" :key="choice">
              <button class="story-choice-btn" @click="$store.game.submitAction(choice)" x-text="choice"></button>
            </template>
            <button class="story-choice-btn ghost" @click="$store.game.autoplay()">閺€鎯х磻閹貉冨煑</button>
          </div>
          <div x-show="$store.game.busy" class="thinking-line">AI 濮濓絽婀禒銉ょ稊閼板懓顫嬬憴鎺旂敾閸愭瑱绱濈痪?20 缁?..</div>
        </div>
      </section>

      <aside class="panel mind-panel dev-section" data-section-title="閸欏厖鏅舵穱鈩冧紖閺?>
        <h3>韫囧啰鎮婇幆铏《</h3>
        <div class="mind-box dev-section" data-section-title="韫囧啰鎮婇幆铏《閸? x-text="$store.game.mindText || '鐟欐帟澹婂锝呮躬鐟欏倸鐧傞幙宥嗗付閼板懐娈戦幇蹇撴禈閵?"></div>
        <h3>閻樿埖鈧?/h3>
        <div class="tag-list dev-section" data-section-title="閻樿埖鈧焦鐖ｇ粵鎯у隘">
          <span x-text="`閹懐鍗庨敍?{$store.game.mood}`"></span>
          <span x-text="`娣団€叉崲閿?{$store.game.trust}`"></span>
          <span x-text="`閸欏秵濮夐敍?{$store.game.resistance}`"></span>
        </div>
        <h3>瑜版挸澧犻惄顔界垼</h3>
        <p class="quest-text dev-section" data-section-title="瑜版挸澧犻惄顔界垼閸? x-text="$store.game.quest"></p>
        <h3>鐠у嫭鏋￠弻銉嚄</h3>
        <div class="lore-search dev-section" data-section-title="鐠у嫭鏋￠弻銉嚄鏉堟挸鍙嗛崠?>
          <input x-model="$store.game.ragQuery" placeholder="閺屻儱缍嬮崜宥勭稊閸濅浇顔曠€?.." @keydown.enter="$store.game.searchLore()">
          <button @click="$store.game.searchLore()" :disabled="$store.game.ragBusy || !$store.game.ragQuery.trim()">閺?/button>
        </div>
        <p class="lore-error" x-show="$store.game.ragError" x-text="$store.game.ragError"></p>
        <div class="lore-results scroll-area dev-section" data-section-title="鐠у嫭鏋￠弻銉嚄缂佹挻鐏夐崠?>
          <template x-for="item in $store.game.ragResults" :key="`${item.path}-${item.chunk}`">
            <article class="lore-item">
              <strong x-text="`${item.novel} #${item.chunk}`"></strong>
              <p x-text="item.text"></p>
            </article>
          </template>
          <p class="empty-lore" x-show="!$store.game.ragResults.length">娑撹崵鍤庨幒銊ㄧ箻閺冩湹绱伴懛顏勫З濡偓缁便垼绁弬娆欑礉娑旂喎褰叉禒銉﹀閸斻劍鐓＄拠顫偓?/p>
        </div>
      </aside>
    </section>

    <footer class="control-dock dev-section" data-section-title="鎼存洟鍎撮幙宥勭稊閺?>
      <div class="free-input dev-section" data-section-title="閼奉亞鏁辨潏鎾冲弳閺?>
        <input x-model="$store.game.input" :placeholder="$store.game.online ? '閻╁瓨甯存潏鎾冲弳娑撳绔村銉攽閸?..' : '缂佹瑨顫楅懝韫閸欍儱缂撶拋顕嗙礉閻掕泛鎮楃拋鈺併偣閼奉亜绻侀崘鍐茬暰...'" :disabled="$store.game.busy" @keydown.enter="$store.game.submitFreeInput()">
        <button @click="$store.game.submitFreeInput()" :disabled="$store.game.busy || !$store.game.input.trim()">閹笛嗩攽</button>
        <label class="thinking-switch" :class="{ active: $store.game.thinkingMode }"><input type="checkbox" x-model="$store.game.thinkingMode">閹繆鈧?/label>
      </div>
    </footer>
  </main>
  </div><!-- HOME_PLAYING_WRAPPER_END -->
</body>
</html>
