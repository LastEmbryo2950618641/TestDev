  <script type="module">
    import { attachBrowserPlatformCore, readBrowserUiSettings } from './platform/browser-core.js';

    attachBrowserPlatformCore(window);
    const s = readBrowserUiSettings(window, 'gamefy-local-settings-v1');
    document.documentElement.setAttribute('data-ui-theme', s.uiThemeId || 'dark');
    document.documentElement.setAttribute('data-ui-density', 'compact');
    if ((s.uiThemeId || 'dark') === 'custom' && s.uiThemeCustomColor) {
      document.documentElement.style.setProperty('--ui-accent', s.uiThemeCustomColor);
    }
  </script>
  <script>
    (function () {
      function clearFallbackClosed() {
        document.querySelectorAll('.faction-modal-backdrop[data-fallback-closed="true"]').forEach(function (backdrop) {
          backdrop.style.removeProperty('display');
          backdrop.removeAttribute('data-fallback-closed');
        });
      }

      function closeFactionDetailNative(event) {
        var target = event && event.target && event.target.closest
          ? event.target.closest('[data-faction-close-detail], .faction-rpg-close')
          : null;
        if (event && !target) return false;
        if (event && event.preventDefault) event.preventDefault();
        if (event && event.stopPropagation) event.stopPropagation();

        function hideCurrentBackdrop() {
          var root = target && target.closest ? target.closest('.faction-modal-backdrop') : null;
          var roots = root ? [root] : Array.prototype.slice.call(document.querySelectorAll('.faction-modal-backdrop'));
          roots.forEach(function (backdrop) {
            if (backdrop.querySelector('.faction-detail, .faction-org-modal')) {
              backdrop.style.setProperty('display', 'none', 'important');
              backdrop.setAttribute('data-fallback-closed', 'true');
            }
          });
        }

        var store = window.Alpine && window.Alpine.store ? window.Alpine.store('game') : null;
        if (store && store.closeFactionDetail) {
          store.closeFactionDetail();
          hideCurrentBackdrop();
          return true;
        }
        if (store && store.factionState) {
          store.factionState.detailOpen = false;
          store.factionState.orgChartOpen = false;
          store.factionState.selectedArchiveDocId = '';
          hideCurrentBackdrop();
          return true;
        }
        hideCurrentBackdrop();
        return true;
      }

      function openFactionDetailNative(event) {
        var row = event.target && event.target.closest ? event.target.closest('[data-faction-id]') : null;
        if (!row || !row.classList || !row.classList.contains('faction-row')) return;
        var factionId = row.getAttribute('data-faction-id') || '';
        var store = window.Alpine && window.Alpine.store ? window.Alpine.store('game') : null;
        if (store && store.selectFaction && factionId) {
          store.selectFaction(factionId);
          if (store.closeFactionArchiveDoc) store.closeFactionArchiveDoc();
          clearFallbackClosed();
          return;
        }
        var detail = Array.prototype.slice.call(document.querySelectorAll('.faction-modal-backdrop'))
          .find(function (backdrop) { return backdrop.querySelector('.faction-detail'); });
        if (detail) {
          if (event.preventDefault) event.preventDefault();
          detail.style.removeProperty('display');
          detail.removeAttribute('data-fallback-closed');
          detail.scrollTop = 0;
        }
      }

      function installFactionDetailNativeNav() {
        if (window.__factionDetailCloseFallbackInstalled) return;
        window.__factionDetailCloseFallbackInstalled = true;
        if (document.documentElement && document.documentElement.dataset) {
          document.documentElement.dataset.factionNativeNav = 'force-hide-v4';
        }
        document.addEventListener('pointerdown', closeFactionDetailNative, true);
        document.addEventListener('click', closeFactionDetailNative, true);
        document.addEventListener('click', openFactionDetailNative, true);
      }

      window.closeFactionDetailNative = closeFactionDetailNative;
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', installFactionDetailNativeNav);
      } else {
        installFactionDetailNativeNav();
      }
    })();
  </script>

  <script>
    window.openEventAppNative = async function openEventAppNative(event) {
      try {
        var store = window.Alpine && window.Alpine.store ? window.Alpine.store('game') : null;
        if (!store) return;
        if (typeof store.openEventApp !== 'function') {
          if (window.GameBoot && window.GameBoot.loadScript) {
            await window.GameBoot.loadScript('event-system.js');
            await window.GameBoot.loadScript('event-actions.js');
          }
          if (window.GameModules && window.GameModules.remergeGameStore) window.GameModules.remergeGameStore();
          store = window.Alpine && window.Alpine.store ? window.Alpine.store('game') : store;
        }
        if (typeof store.openEventApp === 'function') {
          store.openEventApp();
        } else if (store.eventState) {
          store.closeDesktopApps?.();
          store.eventState.open = true;
          store.desktopUnlocked = true;
        }
      } catch (err) {
        console.warn('[濡楀矂娼癩 閸樼喓鏁撻幍鎾崇磻娴滃娆PP婢惰精瑙?', err && err.message ? err.message : err);
      }
    };
  </script>

        <input x-model="$store.game.input" :placeholder="$store.game.online ? '閻╁瓨甯存潏鎾冲弳娑撳绔村銉攽閸?..' : '缂佹瑨顫楅懝韫閸欍儱缂撶拋顕嗙礉閻掕泛鎮楃拋鈺併偣閼奉亜绻侀崘鍐茬暰...'" :disabled="$store.game.busy" @keydown.enter="$store.game.submitFreeInput()">
        <button @click="$store.game.submitFreeInput()" :disabled="$store.game.busy || !$store.game.input.trim()">閹笛嗩攽</button>
        <label class="thinking-switch" :class="{ active: $store.game.thinkingMode }"><input type="checkbox" x-model="$store.game.thinkingMode">閹繆鈧?/label>

    </footer>
  </main>
