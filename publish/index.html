<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content, user-scalable=no">
  <title>我狠狠操控</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="character-select.css">
  <link rel="stylesheet" href="layout.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
  <script src="config.js"></script>
  <script src="prompt.js"></script>
  <script src="sqlite-save.js"></script>
  <script src="rpg-state.js"></script>
  <script src="storage.js"></script>
  <script src="rag-index.js"></script>
  <script src="character-catalog-data.js"></script>
  <script src="rag.js"></script>
  <script src="catalog.js"></script>
  <script src="ai.js"></script>
  <script src="actions.js"></script>
  <script src="save-actions.js"></script>
  <script src="core-actions.js"></script>
  <script src="game.js"></script>
</head>
<body x-data="">
  <div x-show="$store.game.loading" class="loading-screen">
    <div class="loading-card">
      <div class="spinner"></div>
      <p>正在接入操控链路...</p>
    </div>
  </div>

  <button x-show="!$store.game.loading" class="save-fab" @click="$store.game.savePanelOpen = true" x-cloak>设置</button>

  <section x-show="$store.game.savePanelOpen" class="save-modal-backdrop" @click.self="$store.game.savePanelOpen = false" x-cloak>
    <div class="save-modal">
      <header>
        <strong>存档设置</strong>
        <button class="small-btn" @click="$store.game.savePanelOpen = false">关闭</button>
      </header>
      <p>默认提供 10 个存档位。读取会切换到该存档；覆盖会清空该存档后保存当前进度。</p>
      <div class="save-slot-list">
        <template x-for="slot in $store.game.saveSlots" :key="slot">
          <article class="save-slot-item" :class="{ active: $store.game.selectedSlot === slot, empty: !$store.game.saveMeta(slot).exists }">
            <div class="save-slot-info">
              <b x-text="slot"></b>
              <span x-text="$store.game.saveMeta(slot).exists ? '已有存档' : '空存档位'"></span>
              <small x-text="`最近：${$store.game.formatSaveTime($store.game.saveMeta(slot).savedAt)}`"></small>
            </div>
            <div class="save-slot-actions">
              <button class="load-btn" @click="$store.game.loadSlot(slot)" :disabled="$store.game.busy || !$store.game.saveMeta(slot).exists">读取</button>
              <button class="overwrite-btn" @click="$store.game.overwriteSlot(slot)" :disabled="$store.game.busy">覆盖</button>
            </div>
          </article>
        </template>
      </div>
      <small x-show="$store.game.saveMessage" x-text="$store.game.saveMessage"></small>
    </div>
  </section>

  <section x-show="!$store.game.started && !$store.game.loading" class="start-screen" x-cloak>
    <div class="start-card">
      <p class="eyebrow">AI RPG 视觉小说</p>
      <h1>我狠狠操控</h1>
      <p class="intro">选择一个动漫角色作为被操控者。上线时，你接管身体，角色只能在心里想；下线时，控制权回到角色，她会按性格、属性和情绪自主行动。</p>

      <label class="field-label">当前存档</label>
      <button class="ghost-wide" @click="$store.game.savePanelOpen = true" x-text="`打开存档设置｜${$store.game.selectedSlot}`"></button>

      <label class="field-label">操控者代号</label>
      <input class="text-input" x-model="$store.game.playerName" placeholder="输入你的名字或代号">

      <label class="field-label">选择作品</label>
      <select class="text-input" x-model="$store.game.selectedWork" @change="$store.game.selectWork($event.target.value)">
        <template x-for="work in $store.game.works" :key="work.name">
          <option :value="work.name" x-text="work.name"></option>
        </template>
      </select>

      <label class="field-label">选择可操控角色</label>
      <select class="text-input" x-model="$store.game.selectedCharacterId">
        <template x-for="char in $store.game.workCharacters" :key="char.id">
          <option :value="char.id" x-text="`${char.name}｜${char.role}`"></option>
        </template>
      </select>

      <div class="character-detail-card">
        <div class="portrait-mark" x-text="$store.game.character.mark"></div>
        <div>
          <strong x-text="$store.game.character.name"></strong>
          <small x-text="`${$store.game.character.work || '原创'}｜${$store.game.character.role}`"></small>
          <p x-text="$store.game.character.detail || $store.game.character.personality"></p>
        </div>
      </div>

      <div class="ref-list" x-show="$store.game.characterRefs.length">
        <template x-for="ref in $store.game.characterRefs" :key="`${ref.novel}-${ref.chunk}`">
          <article>
            <strong x-text="`${ref.novel} #${ref.chunk}`"></strong>
            <p x-text="ref.text"></p>
          </article>
        </template>
      </div>

      <div class="rules-box">
        <strong>核心规则</strong>
        <p>上线：玩家决定下一步行动，被操控角色只能显示心理想法。</p>
        <p>下线：角色夺回行动权，根据人格和状态自主推进剧情。</p>
      </div>

      <button class="primary-btn" @click="$store.game.start()" :disabled="!$store.game.playerName || $store.game.busy">开始连接</button>
    </div>
  </section>

  <main x-show="$store.game.started && !$store.game.loading" class="game-shell" x-cloak>
    <header class="top-bar">
      <div class="mode-status">
        <span class="mode-dot" :class="$store.game.online ? 'online' : 'offline'"></span>
        <strong x-text="$store.game.online ? '上线中：玩家接管身体' : '下线中：角色自主行动'"></strong>
        <select class="mode-select" :value="$store.game.online ? 'online' : 'offline'" @change="$store.game.setOnline($event.target.value === 'online')" :disabled="$store.game.busy">
          <option value="online">上线</option>
          <option value="offline">下线</option>
        </select>
      </div>
      <div class="top-actions">
        <button class="small-btn" @click="$store.game.savePanelOpen = true">存档</button>
        <button class="small-btn" @click="$store.game.resetGame()">重新开始</button>
      </div>
    </header>

    <section class="rpg-layout">
      <aside class="panel character-panel">
        <div class="character-status-card">
          <div class="avatar-orb" x-text="$store.game.character.mark"></div>
          <div class="character-status-main">
            <div class="name-role-block">
              <h2 x-text="$store.game.character.name"></h2>
              <p class="role" x-text="$store.game.character.role"></p>
            </div>
            <div class="vital-bars" x-show="$store.game.characterRpgState">
              <template x-for="vital in $store.game.rpgVitals($store.game.characterRpgState)" :key="vital.key">
                <div class="vital-row" :class="vital.key">
                  <span x-text="vital.label"></span>
                  <i><b :style="`width: ${Math.max(0, Math.min(100, vital.value))}%`"></b></i>
                  <em x-text="`${vital.value}/100`"></em>
                </div>
              </template>
            </div>
          </div>
        </div>
        <section class="profile-card">
          <b x-text="$store.game.character.work || '原创世界'"></b>
          <p x-text="$store.game.character.detail || $store.game.character.personality"></p>
          <details class="profile-details" x-show="$store.game.currentRpgState">
            <summary>个人资料 / 固化属性</summary>
            <label class="mini-label">查看角色</label>
            <select class="mini-select" x-model="$store.game.rpgPanelCharacterId">
              <template x-for="state in $store.game.rpgStateList" :key="state.id">
                <option :value="state.id" x-text="`${state.name}｜${state.worldTag}`"></option>
              </template>
            </select>
            <div class="dynamic-rpg">
              <template x-for="section in $store.game.rpgEntries($store.game.currentRpgState)" :key="section.title">
                <section>
                  <h3 x-text="section.title"></h3>
                  <template x-for="field in section.fields" :key="field.label">
                    <div class="dynamic-row">
                      <span x-text="field.label"></span>
                      <b x-text="Array.isArray(field.value) ? field.value.join('、') || '无' : field.value"></b>
                    </div>
                  </template>
                </section>
              </template>
            </div>
          </details>
        </section>
      </aside>

      <section class="panel story-panel">
        <div class="scene-title">
          <span x-text="$store.game.sceneTitle"></span>
          <b x-text="`第 ${$store.game.turn} 回合`"></b>
        </div>
        <div class="story-log scroll-area" x-ref="storyLog">
          <template x-for="entry in $store.game.log" :key="entry.id">
            <article class="log-entry" :class="entry.type">
              <span x-text="entry.speaker"></span>
              <p x-text="entry.text"></p>
            </article>
          </template>
          <div x-show="$store.game.busy" class="thinking-line">AI 正在推演剧情，约 20 秒...</div>
        </div>
      </section>

      <aside class="panel mind-panel">
        <h3>心理想法</h3>
        <div class="mind-box" x-text="$store.game.mindText || '角色正在观察操控者的意图。'"></div>
        <h3>状态</h3>
        <div class="tag-list">
          <span x-text="`情绪：${$store.game.mood}`"></span>
          <span x-text="`信任：${$store.game.trust}`"></span>
          <span x-text="`反抗：${$store.game.resistance}`"></span>
        </div>
        <h3>当前目标</h3>
        <p class="quest-text" x-text="$store.game.quest"></p>
        <h3>资料查询</h3>
        <div class="lore-search">
          <input x-model="$store.game.ragQuery" placeholder="查 Fate 资料..." @keydown.enter="$store.game.searchLore()">
          <button @click="$store.game.searchLore()" :disabled="$store.game.ragBusy || !$store.game.ragQuery.trim()">查</button>
        </div>
        <p class="lore-error" x-show="$store.game.ragError" x-text="$store.game.ragError"></p>
        <div class="lore-results scroll-area">
          <template x-for="item in $store.game.ragResults" :key="`${item.path}-${item.chunk}`">
            <article class="lore-item">
              <strong x-text="`${item.novel} #${item.chunk}`"></strong>
              <p x-text="item.text"></p>
            </article>
          </template>
          <p class="empty-lore" x-show="!$store.game.ragResults.length">主线推进时会自动检索资料，也可以手动查询。</p>
        </div>
      </aside>
    </section>

    <footer class="control-dock">
      <div class="choice-row">
        <template x-for="choice in $store.game.choices" :key="choice">
          <button class="choice-btn" @click="$store.game.submitAction(choice)" :disabled="$store.game.busy" x-text="choice"></button>
        </template>
      </div>

      <div class="free-input">
        <input x-model="$store.game.input" :placeholder="$store.game.online ? '直接输入下一步行动...' : '给角色一句建议，然后让她自己决定...'" :disabled="$store.game.busy" @keydown.enter="$store.game.submitFreeInput()">
        <button @click="$store.game.submitFreeInput()" :disabled="$store.game.busy || !$store.game.input.trim()">执行</button>
        <button class="ghost-btn" @click="$store.game.autoplay()" :disabled="$store.game.busy">自由推进</button>
      </div>
    </footer>
  </main>
</body>
</html>
